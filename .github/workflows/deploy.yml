name: Données et déploiement

# Régénère les données à partir de la dernière extraction ANFR puis publie le site sur GitHub Pages.
# L'ANFR publie en général entre le 3 et le 12 du mois : deux passages mensuels couvrent les retards.
on:
  schedule:
    - cron: '23 5 9,16 * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extraction:
        description: "Extraction ANFR (AAAAMMJJ) ou 'latest'"
        default: latest

permissions:
  contents: write   # enregistrement des agrégats d'historique (data/history/) sur main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # le premier passage reconstitue ~90 mois d'archives
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

      # Un déploiement précédent a pu enregistrer des agrégats après le commit déclencheur :
      # on part de ceux de main pour ne pas recalculer les mêmes mois.
      - name: Récupérer l'historique le plus récent
        run: git fetch --depth=1 origin main && git checkout FETCH_HEAD -- data/history || true

      - name: Pipeline de données (+ mois d'archive manquants)
        run: python -m pipeline build --history --extraction "${{ github.event.inputs.extraction || 'latest' }}"

      # Les agrégats mensuels sont légers (~2 Ko par mois) : on les garde dans le dépôt pour ne pas
      # retélécharger 6 Go d'archives à chaque déploiement. Un push fait avec GITHUB_TOKEN ne relance pas de workflow.
      - name: Enregistrer l'historique
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then echo "historique inchangé"; else
            git commit -m "Historique : agrégats des archives ANFR"
            git pull --rebase origin main && git push origin HEAD:main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build du site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
