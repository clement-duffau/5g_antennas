name: Données et déploiement

# Régénère les données à partir de la dernière extraction ANFR puis publie le site sur GitHub Pages.
# L'ANFR publie en général entre le 3 et le 12 du mois : deux passages mensuels couvrent les retards.
on:
  schedule:
    - cron: '23 5 9,16 * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extraction:
        description: "Extraction ANFR (AAAAMMJJ) ou 'latest'"
        default: latest

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

      - name: Pipeline de données
        run: python -m pipeline build --extraction "${{ github.event.inputs.extraction || 'latest' }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build du site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
